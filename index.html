<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
minimum-scale=1.0,
user-scalable=no,
viewport-fit=cover
">

<title>DayDream Beats!! Ultimate</title>

<style>

/* =========================
   基本
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;

background:black;

touch-action:none;
overscroll-behavior:none;
}

body{

background:
linear-gradient(
to bottom,
#58c6ff,
#001d3d
);

}

/* =========================
   ゲーム本体
========================= */

#game{
position:relative;

width:100vw;
height:100vh;

overflow:hidden;

color:white;
}

/* =========================
   背景
========================= */

.bg{
position:absolute;

width:100%;
height:100%;

background:
url("bg.jpg")
center/cover;

opacity:0.35;
}

/* =========================
   上UI
========================= */

.top-ui{

position:absolute;

top:15px;
left:0;

width:100%;

padding:0 15px;

display:flex;

justify-content:space-between;
align-items:center;

z-index:100;
}

.song-title{

font-size:18px;
font-weight:bold;

text-shadow:
0 0 10px black;
}

.score{

font-size:22px;
font-weight:bold;

text-shadow:
0 0 12px white;
}

/* =========================
   コンボ
========================= */

#combo{

position:absolute;

bottom:78px;
left:50%;

transform:
translateX(-50%);

font-size:42px;
font-weight:bold;

z-index:100;

text-shadow:
0 0 20px white;
}

/* =========================
   判定
========================= */

#judge{

position:absolute;

bottom:90px;
right:15px;

font-size:18px;
font-weight:bold;

z-index:100;

text-align:right;

text-shadow:
0 0 10px currentColor;
}

/* =========================
   レーン
========================= */

.lanes{

position:absolute;

bottom:0;
left:50%;

transform:
translateX(-50%);

width:95%;
max-width:520px;

height:100%;

display:flex;
}

.lane{

flex:1;

position:relative;

border-left:
2px solid rgba(255,255,255,0.15);

border-right:
2px solid rgba(255,255,255,0.15);
}

/* =========================
   判定ライン
========================= */

.hit-line{

position:absolute;

bottom:130px;

width:100%;
height:10px;

background:white;

box-shadow:
0 0 20px white,
0 0 40px white;
}

/* =========================
   ノーツ
========================= */

.note{

position:absolute;

width:80%;
height:24px;

left:10%;

border-radius:15px;

background:
linear-gradient(
90deg,
#ffffff,
#8ce8ff
);

box-shadow:
0 0 15px #8ce8ff,
0 0 35px #8ce8ff;
}

/* =========================
   タップエフェクト
========================= */

.tap-effect{

position:absolute;

bottom:110px;

width:100%;
height:60px;

animation:flash 0.25s;
}

@keyframes flash{

0%{
opacity:1;
transform:scaleY(1);
}

100%{
opacity:0;
transform:scaleY(2);
}

}

/* =========================
   スタートメニュー
========================= */

.start-menu{

position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);

display:flex;
flex-direction:column;

gap:15px;

z-index:300;
}

/* =========================
   ボタン
========================= */

.menu-btn{

padding:20px 35px;

font-size:24px;
font-weight:bold;

border:none;
border-radius:20px;

background:white;
color:#333;

box-shadow:
0 0 25px white;
}

/* =========================
   FULL COMBO
========================= */

#fullcombo{

position:absolute;

top:42%;
left:50%;

transform:
translate(-50%,-50%);

font-size:44px;
font-weight:bold;

display:none;

color:gold;

z-index:200;

text-shadow:
0 0 25px gold,
0 0 50px gold;

animation:pulse 1s infinite;
}

@keyframes pulse{

0%{
transform:
translate(-50%,-50%)
scale(1);
}

50%{
transform:
translate(-50%,-50%)
scale(1.1);
}

100%{
transform:
translate(-50%,-50%)
scale(1);
}

}

/* =========================
   リザルト
========================= */

#result-screen{

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

display:none;

flex-direction:column;
justify-content:center;
align-items:center;

gap:16px;

background:
rgba(0,0,0,0.88);

z-index:500;
}

.result-title{

font-size:42px;
font-weight:bold;

color:#8ce8ff;

text-shadow:
0 0 20px #8ce8ff;
}

.result-text{

font-size:24px;
font-weight:bold;
}

.result-btn{

padding:16px 30px;

font-size:20px;
font-weight:bold;

border:none;
border-radius:20px;

background:white;
color:#222;

box-shadow:
0 0 20px white;
}

</style>
</head>

<body>

<div id="game">

<!-- 背景 -->

<div class="bg"></div>

<!-- 上UI -->

<div class="top-ui">

<div class="song-title">
🎵 DayDream Beats!!
</div>

<div class="score"
id="score">
Score : 0
</div>

</div>

<!-- 判定 -->

<div id="judge">
READY
</div>

<!-- コンボ -->

<div id="combo">
0
</div>

<!-- FULL COMBO -->

<div id="fullcombo">
🌟 FULL COMBO 🌟
</div>

<!-- スタート -->

<div class="start-menu"
id="startMenu">

<button class="menu-btn"
onclick="startGame()">
▶ START
</button>

</div>

<!-- レーン -->

<div class="lanes">

<div class="lane"
data-lane="0">

<div class="hit-line"></div>

</div>

<div class="lane"
data-lane="1">

<div class="hit-line"></div>

</div>

<div class="lane"
data-lane="2">

<div class="hit-line"></div>

</div>

<div class="lane"
data-lane="3">

<div class="hit-line"></div>

</div>

</div>

<!-- リザルト -->

<div id="result-screen">

<div class="result-title">
🎉 LIVE CLEAR 🎉
</div>

<div class="result-text"
id="result-score">
SCORE : 0
</div>

<div class="result-text"
id="result-combo">
MAX COMBO : 0
</div>

<div class="result-text"
id="result-miss">
MISS : 0
</div>

<button class="result-btn"
onclick="restartGame()">
▶ RESTART
</button>

</div>

</div>

<!-- 音楽 -->

<audio id="music"
src="kaze.mp3">
</audio>

<script>

/* =========================
   音楽
========================= */

const music =
document.getElementById(
"music"
);

/* =========================
   UI
========================= */

const comboText =
document.getElementById(
"combo"
);

const judgeText =
document.getElementById(
"judge"
);

const scoreText =
document.getElementById(
"score"
);

const fullcombo =
document.getElementById(
"fullcombo"
);

const resultScreen =
document.getElementById(
"result-screen"
);

const resultScore =
document.getElementById(
"result-score"
);

const resultCombo =
document.getElementById(
"result-combo"
);

const resultMiss =
document.getElementById(
"result-miss"
);

const startMenu =
document.getElementById(
"startMenu"
);

/* =========================
   レーン
========================= */

const lanes =
document.querySelectorAll(
".lane"
);

/* =========================
   状態
========================= */

let combo = 0;
let score = 0;
let miss = 0;
let maxCombo = 0;

let started = false;

let noteSpeed = 4;

let noteInterval = 380;

let notes = [];

/* =========================
   コンボ倍率
========================= */

const COMBO_RATES = [

{
min:101,
bonus:15
},

{
min:51,
bonus:10
},

{
min:32,
bonus:8
},

{
min:12,
bonus:2.5
},

{
min:1,
bonus:2.0
}

];

/* =========================
   スコア表示
========================= */

function formatScore(val){

return val.toLocaleString();

}

/* =========================
   ノーツ生成
========================= */

function generateNotes(){

notes = [];

const songLength =
music.duration * 1000;

for(
let i = 1000;
i < songLength;
i += noteInterval
){

notes.push({

time:i,

lane:
Math.floor(
Math.random() * 4
)

});

}

}

/* =========================
   ゲーム開始
========================= */

function startGame(){

if(started) return;

started = true;

startMenu.style.display =
"none";

music.currentTime = 0;

music.play();

generateNotes();

gameLoop();

}

/* =========================
   リスタート
========================= */

function restartGame(){

location.reload();

}

/* =========================
   メインループ
========================= */

function gameLoop(){

const currentTime =
music.currentTime * 1000;

notes.forEach(note=>{

if(
!note.spawned &&
currentTime >= note.time - 2200
){

createNote(note);

note.spawned = true;

}

});

if(!music.paused){

requestAnimationFrame(
gameLoop
);

}

}

/* =========================
   ノーツ生成
========================= */

function createNote(noteData){

const lane =
lanes[noteData.lane];

const note =
document.createElement(
"div"
);

note.classList.add(
"note"
);

note.dataset.hit =
"false";

lane.appendChild(note);

let pos = -30;

const move = setInterval(()=>{

pos += noteSpeed;

note.style.top =
pos + "px";

if(
pos >= window.innerHeight
){

if(
note.dataset.hit === "false"
){

miss++;

combo = 0;

comboText.innerText =
combo;

judgeText.style.color =
"#ff6060";

judgeText.innerText =
"MISS ❌";

/* 通過MISS */

score = Math.max(
0,
score - 300
);

scoreText.innerText =
"Score : " +
formatScore(score);

}

note.remove();

clearInterval(move);

}

},16);

note.move = move;

}

/* =========================
   判定
========================= */

function hitNote(laneIndex){

const lane =
lanes[laneIndex];

const laneNotes =
lane.querySelectorAll(
".note"
);

/* 空打ち */

if(
laneNotes.length === 0
){

miss++;

combo = 0;

comboText.innerText =
combo;

judgeText.style.color =
"#ff6060";

judgeText.innerText =
"MISS ❌";

/* 空打ち減点 */

score = Math.max(
0,
score - 200
);

scoreText.innerText =
"Score : " +
formatScore(score);

return;

}

/* ノーツ */

const note =
laneNotes[0];

const rect =
note.getBoundingClientRect();

const hitY =
window.innerHeight - 155;

const signedDiff =
rect.top - hitY;

const diff =
Math.abs(
signedDiff
);

const timing =
signedDiff < 0
? " ⏩EARLY"
: " ⏪LATE";

let baseScore = 0;

let judgeType = "";

/* =========================
   EXCELLENT
========================= */

if(diff < 35){

judgeType =
"EXCELLENT";

judgeText.style.color =
"#ffccff";

judgeText.innerText =
"EXCELLENT ☆彡";

baseScore = 1000;

/* =========================
   PERFECT
========================= */

}else if(diff < 70){

judgeType =
"PERFECT";

judgeText.style.color =
"#ffe066";

judgeText.innerText =
"PERFECT ✨";

baseScore = 500;

/* =========================
   GREAT
========================= */

}else if(diff < 120){

judgeType =
"GREAT";

judgeText.style.color =
"#66dfff";

judgeText.innerText =
"GREAT 🔥" +
timing;

baseScore = 200;

/* =========================
   GOOD
========================= */

}else if(diff < 170){

judgeType =
"GOOD";

judgeText.style.color =
"#a0ff88";

judgeText.innerText =
"GOOD 👍" +
timing;

baseScore = 100;

/* =========================
   MISS
========================= */

}else{

judgeText.style.color =
"#ff6060";

judgeText.innerText =
"MISS ❌";

miss++;

combo = 0;

comboText.innerText =
combo;

/* タイミングMISS */

score = Math.max(
0,
score - 300
);

scoreText.innerText =
"Score : " +
formatScore(score);

return;

}

/* =========================
   精度倍率
========================= */

const accuracyRate =
Math.max(
0,
1 - (diff / 170)
);

/* =========================
   10点単位
========================= */

let addScore =
Math.round(
(baseScore * accuracyRate)
/ 10
) * 10;

/* =========================
   コンボ
========================= */

combo++;

if(combo > maxCombo){

maxCombo = combo;

}

comboText.innerText =
combo;

/* =========================
   コンボ倍率
========================= */

let comboBonus = 2.0;

for(
const r of COMBO_RATES
){

if(combo >= r.min){

comboBonus =
r.bonus;

break;

}

}

/* =========================
   倍率適用
========================= */

addScore =
Math.round(
addScore * comboBonus
);

/* =========================
   スコア加算
========================= */

score += addScore;

/* =========================
   EXCELLENT BONUS
========================= */

if(
judgeType ===
"EXCELLENT" &&
combo % 15 === 0
){

score += 25000;

judgeText.innerText =
"🌟 EXCELLENT BONUS +25000";

}

/* =========================
   PERFECT BONUS
========================= */

if(
judgeType ===
"PERFECT" &&
combo % 10 === 0
){

score += 10000;

judgeText.innerText =
"✨ PERFECT BONUS +10000";

}

/* =========================
   GREAT BONUS
========================= */

if(
judgeType ===
"GREAT" &&
combo % 10 === 0
){

score += 5000;

judgeText.innerText =
"🔥 GREAT BONUS +5000";

}

/* =========================
   GOOD BONUS
========================= */

if(
judgeType ===
"GOOD" &&
combo % 10 === 0
){

score += 2000;

judgeText.innerText =
"👍 GOOD BONUS +2000";

}

/* =========================
   スコア更新
========================= */

scoreText.innerText =
"Score : " +
formatScore(score);

/* =========================
   ノーツ削除
========================= */

note.dataset.hit =
"true";

clearInterval(
note.move
);

note.remove();

/* =========================
   エフェクト
========================= */

tapEffect(
lane,
judgeText.style.color
);

}

/* =========================
   タップエフェクト
========================= */

function tapEffect(
lane,
color
){

const effect =
document.createElement(
"div"
);

effect.classList.add(
"tap-effect"
);

effect.style.background =
color;

effect.style.boxShadow =
"0 0 20px " +
color +
",0 0 40px " +
color;

lane.appendChild(
effect
);

setTimeout(()=>{

effect.remove();

},250);

}

/* =========================
   スマホ操作
========================= */

lanes.forEach(
(lane,index)=>{

lane.addEventListener(
"touchstart",
(e)=>{

e.preventDefault();

hitNote(index);

},
{ passive:false }
);

}
);

/* =========================
   キーボード
========================= */

document.addEventListener(
"keydown",
(e)=>{

if(e.key === "d"){

hitNote(0);

}

if(e.key === "f"){

hitNote(1);

}

if(e.key === "j"){

hitNote(2);

}

if(e.key === "k"){

hitNote(3);

}

}
);

/* =========================
   曲終了
========================= */

music.addEventListener(
"ended",
()=>{

if(miss === 0){

fullcombo.style.display =
"block";

}

resultScore.innerText =
"SCORE : " +
formatScore(score);

resultCombo.innerText =
"MAX COMBO : " +
maxCombo;

resultMiss.innerText =
"MISS : " +
miss;

resultScreen.style.display =
"flex";

}
);

</script>

</body>
</html>
