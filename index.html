<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no
">

<title>DayDream Beats!!</title>

<!-- PWA: ホーム画面から全画面起動 -->
<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta name="apple-mobile-web-app-title"
content="DayDream Beats">

<meta name="mobile-web-app-capable"
content="yes">

<meta name="theme-color"
content="#001d3d">

<link rel="manifest"
href="manifest.json">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:black;

touch-action:none;
overscroll-behavior:none;
}

#game{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;

background:
linear-gradient(
to bottom,
#58c6ff,
#001d3d
);

color:white;
}

/* 背景 */
.bg{
position:absolute;
width:100%;
height:100%;

background:
url('bg.jpg')
center/cover;

opacity:0.35;
}

/* 上UI */
.top-ui{
position:absolute;

top:15px;
left:0;

width:100%;

padding:0 55px 0 15px;

display:flex;
justify-content:space-between;
align-items:center;

z-index:100;
}

.song-title{

font-size:18px;
font-weight:bold;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

max-width:60%;

text-shadow:
0 0 10px black;
}

.score{
font-size:18px;
font-weight:bold;
}

/* ボタン（プレイ中は左下に表示） */
.controls{

position:absolute;

/* デフォルト位置（スタート前） */
top:60px;
left:50%;

transform:translateX(-50%);

display:flex;
flex-wrap:wrap;

justify-content:center;

gap:8px;

width:95%;

z-index:100;

transition: all 0.3s ease;
}

/* プレイ中は判定ラインの左下 */
.controls.playing{
top: auto;
bottom: 60px;
left: 10px;
transform: none;
width: auto;
flex-direction: column;
gap: 6px;
}

.control-btn{

padding:8px 14px;

border:none;
border-radius:12px;

background:white;
color:#222;

font-size:13px;
font-weight:bold;

box-shadow:
0 0 10px white;
}

/* プレイ中は小さく */
.controls.playing .control-btn{
padding: 7px 12px;
font-size: 12px;
opacity: 0.85;
box-shadow: 0 0 8px white;
}

/* 難易度 */
.mode-area{

position:absolute;

top:120px;
left:50%;

transform:translateX(-50%);

display:flex;
flex-wrap:wrap;

justify-content:center;

gap:8px;

width:95%;

z-index:100;

transition: opacity 0.3s ease, visibility 0.3s ease;
}

/* プレイ中は非表示 */
.mode-area.hidden{
opacity: 0;
visibility: hidden;
pointer-events: none;
}

.mode-btn{

padding:8px 14px;

border:none;
border-radius:12px;

background:#ffffffcc;

font-size:13px;
font-weight:bold;
}

/* コンボ：判定ラインの下に配置 */
#combo{
position:absolute;

bottom: 82px;
left:50%;

transform:translateX(-50%);

font-size:36px;
font-weight:bold;

z-index:100;

text-shadow:
0 0 20px white;
}

/* 判定：判定ラインの右下に小さく */
#judge{
position:absolute;

bottom: 90px;
right: 15px;

font-size:15px;
font-weight:bold;

z-index:100;

text-align:right;

text-shadow:
0 0 8px currentColor;

opacity: 0.9;

transition: color 0.1s ease;
}

/* レーン */
.lanes{
position:absolute;

bottom:0;
left:50%;

transform:translateX(-50%);

width:95%;
max-width:520px;

height:100%;

display:flex;
}

/* レーン */
.lane{
flex:1;
position:relative;

border-left:
2px solid rgba(255,255,255,0.15);

border-right:
2px solid rgba(255,255,255,0.15);
}

/* 判定ライン */
.hit-line{
position:absolute;

bottom:130px;

width:100%;
height:10px;

background:white;

box-shadow:
0 0 20px white,
0 0 40px white;
}

/* ノーツ */
.note{
position:absolute;

width:80%;
height:24px;

left:10%;

border-radius:15px;

background:
linear-gradient(
90deg,
#ffffff,
#8ce8ff
);

box-shadow:
0 0 15px #8ce8ff,
0 0 35px #8ce8ff;
}

.song-delete-btn{
float:right;
font-size:12px;
color:rgba(255,100,100,0.8);
margin-left:8px;
padding:2px 4px;
border-radius:6px;
background:rgba(255,100,100,0.15);
}

.song-delete-btn:active{
background:rgba(255,100,100,0.4);
}

/* 進行バー */
#progress-bar-wrap{
position:absolute;
top: 48px;
left: 0;
width: 100%;
z-index: 100;
display: none;
flex-direction: column;
align-items: flex-end;
padding: 0 10px;
gap: 2px;
}

#progress-bar{
width: 100%;
height: 4px;
background: rgba(255,255,255,0.2);
border-radius: 4px;
overflow: hidden;
position: relative;
}

#progress-bar::after{
content: "";
position: absolute;
top: 0; left: 0;
height: 100%;
width: 0%;
background: linear-gradient(
90deg, #8ce8ff, #ffffff
);
box-shadow: 0 0 8px #8ce8ff;
border-radius: 4px;
transition: width 0.5s linear;
}

#progress-time{
font-size: 11px;
color: rgba(255,255,255,0.7);
font-weight: bold;
}

/* ダブルノート（上級） */
.note.double{
background:
linear-gradient(
90deg,
#ffcc00,
#ff6600
);
box-shadow:
0 0 15px #ff6600,
0 0 35px #ff6600;
}

/* タップ演出 */
.tap-effect{
position:absolute;

bottom:110px;

width:100%;
height:60px;

background:
rgba(255,255,255,0.5);

animation:flash 0.25s;
}

@keyframes flash{

0%{
opacity:1;
transform:scaleY(1);
}

100%{
opacity:0;
transform:scaleY(2);
}

}

/* 曲追加エリア */
#add-song-area{
width:100%;
max-width:280px;
margin-top:4px;
}

#add-song-label{
display:block;
width:100%;
padding:12px 16px;
border-radius:14px;
border:2px dashed rgba(140,232,255,0.5);
background:transparent;
color:#8ce8ff;
font-size:14px;
font-weight:bold;
text-align:center;
box-sizing:border-box;
}

#add-song-input{
display:block;
width:100%;
margin-top:6px;
padding:8px;
border-radius:10px;
border:1px solid rgba(140,232,255,0.3);
background:rgba(255,255,255,0.08);
color:white;
font-size:13px;
box-sizing:border-box;
}

/* iOSでfile inputのテキストを白に */
#add-song-input::-webkit-file-upload-button{
background:rgba(140,232,255,0.2);
color:#8ce8ff;
border:1px solid rgba(140,232,255,0.4);
border-radius:8px;
padding:6px 10px;
font-size:12px;
font-weight:bold;
}

/* 曲選択メニュー */
.song-select-title{
font-size:16px;
font-weight:bold;
letter-spacing:3px;
color:#aee8ff;
text-shadow:0 0 10px #aee8ff;
margin-bottom:4px;
text-align:center;
}

.song-list{
display:flex;
flex-direction:column;
gap:10px;
width:100%;
}

.song-btn{
padding:14px 20px;
border:none;
border-radius:16px;
background:rgba(255,255,255,0.15);
color:white;
font-size:15px;
font-weight:bold;
text-align:left;
box-shadow:0 0 12px rgba(140,232,255,0.3);
border:1px solid rgba(140,232,255,0.3);
line-height:1.5;
}

.song-btn:active{
background:rgba(255,255,255,0.35);
}

.song-btn .song-btn-title{
font-size:16px;
display:block;
}

.song-btn .song-btn-artist{
font-size:12px;
color:#aee8ff;
display:block;
}

.song-btn.selected{
background:rgba(140,232,255,0.3);
box-shadow:0 0 20px rgba(140,232,255,0.6);
border-color:#8ce8ff;
}

/* スタート画面 */
.start-menu{

position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);

display:flex;
flex-direction:column;

gap:15px;

z-index:300;
}

/* スタートボタン */
.menu-btn{

padding:20px 35px;

font-size:24px;
font-weight:bold;

border:none;
border-radius:20px;

background:white;
color:#333;

box-shadow:
0 0 25px white;
}

/* フルコン */
#fullcombo{
position:absolute;

top:45%;
left:50%;

transform:
translate(-50%,-50%);

font-size:42px;
font-weight:bold;

color:gold;

display:none;

z-index:300;

text-shadow:
0 0 25px gold,
0 0 50px gold;

animation:pulse 1s infinite;
}

@keyframes pulse{

0%{
transform:
translate(-50%,-50%)
scale(1);
}

50%{
transform:
translate(-50%,-50%)
scale(1.1);
}

100%{
transform:
translate(-50%,-50%)
scale(1);
}

}

/* 全画面ボタン */
#fullscreen-btn{
position:absolute;
top: 15px;
right: 15px;
z-index: 500;
padding: 6px 10px;
border: none;
border-radius: 10px;
background: rgba(255,255,255,0.25);
color: white;
font-size: 18px;
cursor: pointer;
backdrop-filter: blur(4px);
box-shadow: 0 0 8px rgba(255,255,255,0.3);
}
/* 成功率オーバーレイ */
#accuracy-overlay{
position:absolute;
top:0;left:0;
width:100%;height:100%;
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
gap:10px;
z-index:350;
background:rgba(0,10,40,0.75);
backdrop-filter:blur(4px);
}
#accuracy-label{
font-size:16px;
font-weight:bold;
letter-spacing:4px;
color:#aee8ff;
opacity:0;
transition:opacity 0.6s ease;
}
#accuracy-number{
font-size:88px;
font-weight:bold;
color:white;
text-shadow:
0 0 30px #8ce8ff,
0 0 60px #8ce8ff;
opacity:0;
transform:scale(0.6);
transition:
opacity 0.6s ease,
transform 0.6s cubic-bezier(0.34,1.56,0.64,1);
}
#accuracy-sub{
font-size:18px;
font-weight:bold;
color:gold;
text-shadow:0 0 16px gold;
opacity:0;
transition:opacity 0.6s ease 0.4s;
min-height:28px;
text-align:center;
}
#accuracy-overlay.show #accuracy-label,
#accuracy-overlay.show #accuracy-number,
#accuracy-overlay.show #accuracy-sub{
opacity:1;
}
#accuracy-overlay.show #accuracy-number{
transform:scale(1);
}

#result-screen{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;

display:none;
flex-direction:column;
align-items:center;
justify-content:center;

padding: 20px 16px;
box-sizing: border-box;
overflow-y: auto;

gap:12px;

z-index:400;

background:
linear-gradient(
160deg,
rgba(0,30,80,0.92),
rgba(0,80,140,0.92)
);

backdrop-filter: blur(6px);
}

.result-title{
font-size:26px;
font-weight:bold;
letter-spacing:3px;
text-align:center;
white-space:nowrap;
text-shadow:
0 0 20px #8ce8ff,
0 0 40px #8ce8ff;
animation: resultPulse 1.2s ease-in-out infinite;
}

@keyframes resultPulse{
0%{ transform:scale(1); }
50%{ transform:scale(1.04); }
100%{ transform:scale(1); }
}

.result-divider{
width:80%;
max-width:260px;
height:2px;
background:
linear-gradient(
90deg,
transparent,
#8ce8ff,
transparent
);
}

.result-rows{
display:flex;
flex-direction:column;
gap:8px;
width:100%;
max-width:280px;
}

.result-row{
display:flex;
justify-content:space-between;
align-items:center;
font-size:16px;
font-weight:bold;
}

.result-label{
color:#aee8ff;
font-size:13px;
}

.result-value{
font-size:18px;
text-shadow: 0 0 10px white;
}

#result-fullcombo-badge{
display:none;
font-size:22px;
font-weight:bold;
color:gold;
text-align:center;
text-shadow:
0 0 20px gold,
0 0 40px gold;
animation:pulse 1s infinite;
}

.result-btn{
padding:12px 28px;
font-size:16px;
font-weight:bold;
border:none;
border-radius:18px;
background:white;
color:#333;
box-shadow: 0 0 20px white;
}

</style>
</head>

<body>

<div id="game">

<div class="bg"></div>

<!-- 全画面ボタン -->
<button id="fullscreen-btn" onclick="toggleFullscreen()" title="全画面">⛶</button>

<!-- 上UI -->
<div class="top-ui">

<div class="song-title">
🎵 風になる合図 / 蓮
</div>

<div class="score"
id="score">
Score : 0.00
</div>

</div>

<!-- 進行バー -->
<div id="progress-bar-wrap">
<div id="progress-bar"></div>
<div id="progress-time">0:00 / 0:00</div>
</div>

<!-- コントロール（プレイ中は左下へ） -->
<div class="controls" id="controls">

<button class="control-btn"
onclick="pauseGame()">
⏸ 一時停止
</button>

<button class="control-btn"
onclick="resetScore()">
🔄 リセット
</button>

</div>

<!-- 難易度（スタートメニュー内に移動・ここは非表示） -->
<div class="mode-area" id="modeArea"
style="display:none!important;visibility:hidden;pointer-events:none;">

<button class="mode-btn"
onclick="setEasyMode()">
🌟 初級

onclick="setHardMode()">
🔥 上級
</button>

</div>

<!-- 判定 -->
<div id="judge">
READY
</div>

<!-- フルコン -->
<div id="fullcombo">
🌟 FULL COMBO 🌟
</div>

<!-- ゲーム終了画面 -->
<div id="result-screen">

<div class="result-title">
🎉 LIVE CLEAR 🎉
</div>

<div id="result-fullcombo-badge">
🌟 FULL COMBO 🌟
</div>

<div class="result-divider"></div>

<div class="result-rows">

<div class="result-row">
<span class="result-label">SCORE</span>
<span class="result-value" id="result-score">0</span>
</div>

<div class="result-row">
<span class="result-label">MAX COMBO</span>
<span class="result-value" id="result-combo">0</span>
</div>

<div class="result-row">
<span class="result-label">MISS</span>
<span class="result-value" id="result-miss">0</span>
</div>

<div class="result-row">
<span class="result-label">減点合計</span>
<span class="result-value" id="result-deduct"
style="color:#ff7070;">-0</span>
</div>

<div class="result-row">
<span class="result-label">SUCCESS RATE</span>
<span class="result-value" id="result-accuracy"
style="color:#ffe066;">0%</span>
</div>

<div class="result-row">
<span class="result-label">FAILURE RATE</span>
<span class="result-value" id="result-failure"
style="color:#ff7070;">0%</span>
</div>

</div>

<!-- 100%達成メッセージ -->
<div id="result-perfect-msg"
style="
display:none;
text-align:center;
font-size:13px;
font-weight:bold;
color:gold;
letter-spacing:1px;
line-height:1.6;
text-shadow:0 0 12px gold, 0 0 24px gold;
animation: resultPulse 1.2s ease-in-out infinite;
padding: 0 10px;
">
🏆 SUPER EXCELLENT<br>CONGRATULATIONS! 🏆
</div>

<div class="result-divider"></div>

<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">

<button class="result-btn"
onclick="closeResult()"
style="background:white;color:#333;">
▶ もう一度プレイ
</button>

<button class="result-btn"
onclick="goToStart()"
style="background:rgba(255,255,255,0.2);color:white;box-shadow:0 0 10px rgba(255,255,255,0.3);">
🏠 スタートに戻る
</button>

</div>

</div>

<!-- 成功率オーバーレイ（ゲーム画面上） -->
<div id="accuracy-overlay">

<div id="accuracy-label">SUCCESS RATE</div>

<div id="accuracy-number">0%</div>

<div id="accuracy-sub"></div>

</div>

<!-- スタート -->
<div class="start-menu" id="startMenu">

<div class="song-select-title">🎵 SELECT SONG</div>

<div class="song-list" id="songList">
<!-- JSで動的生成 -->
</div>

<!-- 曲追加エリア -->
<div id="add-song-area">

<label for="add-song-input" id="add-song-label">
  ➕ 曲ファイルを選ぶ
</label>

<input
  type="file"
  id="add-song-input"
  accept="audio/mpeg,audio/mp4,audio/wav,audio/ogg,audio/aac,.mp3,.m4a,.wav,.ogg,.aac"
  onchange="addSongFromFile(this)"

</div>

style="display:flex;gap:8px;justify-content:center;margin-top:4px;">

<button class="mode-btn" onclick="setHardMode()">🔥 上級</button>
</div>

<button class="menu-btn"
onclick="restartGame()"

▶ スタート
</button>

</div>

<div class="lanes">

</div>

</div>

<div class="hit-line"></div>
</div>

</div>

0
</div>

</div>

<!-- 音楽 -->
<audio id="music"
src="kaze.mp3">
</audio>

<!-- SE -->
<audio id="se-combo30"  src="combo30.mp3"  preload="auto"></audio>
<audio id="se-combo50"  src="combo50.mp3"  preload="auto"></audio>
<audio id="se-combo70"  src="combo70.mp3"  preload="auto"></audio>
<audio id="se-combo100" src="combo100.mp3" preload="auto"></audio>
<audio id="se-miss"     src="miss.mp3"     preload="auto"></audio>

<script>

/* 全画面 */
function toggleFullscreen(){

const btn =
document.getElementById(
"fullscreen-btn"
);

if(!document.fullscreenElement){

document.documentElement
.requestFullscreen()
.catch(err=>{
console.log(err);
});

btn.innerText = "✕";

}else{

document.exitFullscreen();

btn.innerText = "⛶";

}

}

document.addEventListener(
"fullscreenchange",
()=>{

const btn =
document.getElementById(
"fullscreen-btn"
);

if(!document.fullscreenElement){
btn.innerText = "⛶";
}else{
btn.innerText = "✕";
}

}
);

/* スコア表示フォーマット（カンマ区切り・小数2桁） */
function formatScore(val){
const fixed = val.toFixed(2);
const parts = fixed.split(".");
parts[0] = parts[0].replace(
/\B(?=(\d{3})+(?!\d))/g, ","
);
return parts.join(".");
}

/* SE再生 */
function playSE(id){
const el = document.getElementById(id);
if(!el) return;
el.currentTime = 0;
el.play().catch(()=>{});
}

/* iOS音声アンロック：最初のタップで全SEを解放 */
let audioUnlocked = false;

function unlockAudio(){

if(audioUnlocked) return;
audioUnlocked = true;

const seIds = [
"se-combo30",
"se-combo50",
"se-combo70",
"se-combo100",
"se-miss"
];

seIds.forEach(id=>{
const el =
document.getElementById(id);
if(!el) return;
el.volume = 0;
el.play()
.then(()=>{ el.pause(); el.volume = 1; })
.catch(()=>{ el.volume = 1; });
});

}

document.addEventListener(
"touchstart",
unlockAudio,
{ once: true, passive: true }
);

document.addEventListener(
"mousedown",
unlockAudio,
{ once: true }
);

/* 曲データ ─ ここにオブジェクトを追加するだけで曲選択に自動反映 */
const SONGS = [
{
title: "風になる合図",
artist: "蓮",
src: "kaze.mp3"
},
{
title: "きらめく方程式",
artist: "DayDream プラス",
src: "きらめく方程式.mp3"
}
/* ↓ 3曲目以降はここに追加
,{
title: "曲名",
artist: "アーティスト名",
src: "ファイル名.mp3"
}
*/
];

let currentSong = 0;

/* 曲を削除 */
function deleteSong(e, index){

e.stopPropagation();

/* BlobURLを解放 */
if(SONGS[index].isLocal){
URL.revokeObjectURL(SONGS[index].src);
}

SONGS.splice(index, 1);

if(currentSong >= SONGS.length){
currentSong = SONGS.length - 1;
}

buildSongList();

}

/* ファイルから曲を追加（iOS対応） */
function addSongFromFile(input){

const file = input.files[0];
if(!file) return;

const url = URL.createObjectURL(file);

const rawName =
file.name.replace(/\.[^/.]+$/, "");

const tmpAudio = new Audio();
tmpAudio.src = url;

tmpAudio.addEventListener(
"loadedmetadata",
()=>{

SONGS.push({
title: rawName,
artist: "追加曲",
src: url,
isLocal: true,
duration: tmpAudio.duration
});

currentSong = SONGS.length - 1;

buildSongList();

input.value = "";

},
{ once: true }
);

tmpAudio.onerror = ()=>{
alert("読み込み失敗しました");
input.value = "";
};

/* 明示的にloadを呼ぶ（iOS対策） */
tmpAudio.load();

}

/* 曲リストを動的生成 */
function buildSongList(){

const list =
document.getElementById("songList");

list.innerHTML = "";

SONGS.forEach((song, i)=>{

const btn =
document.createElement("button");

btn.className =
"song-btn" +
(i === currentSong ? " selected" : "");

btn.id = "songBtn" + i;

/* ローカル曲は削除ボタン付き */
const deleteBtn = song.isLocal
? `<span class="song-delete-btn"
onclick="deleteSong(event,${i})">✕</span>`
: "";

btn.innerHTML =
`<span class="song-btn-title">
${song.title}${deleteBtn}
</span>
<span class="song-btn-artist">
${song.artist}
</span>`;

btn.onclick = ()=> selectSong(i);

list.appendChild(btn);

});

}

/* 進行バー更新 */
const progressWrap =
document.getElementById("progress-bar-wrap");

const progressBar =
document.getElementById("progress-bar");

const progressTime =
document.getElementById("progress-time");

function formatTime(sec){
const m = Math.floor(sec / 60);
const s = Math.floor(sec % 60)
.toString().padStart(2,"0");
return m + ":" + s;
}

function updateProgress(){

if(!started || paused) return;

const cur = music.currentTime;
const dur = music.duration || 1;
const pct = Math.min(cur / dur * 100, 100);

progressBar.style.setProperty(
"--prog", pct + "%"
);

/* ::afterのwidthをCSS変数で制御 */
progressBar.querySelector ?
null : null;

/* 直接styleで制御 */
progressBar.style.background =
`linear-gradient(90deg,
#8ce8ff ${pct}%,
rgba(255,255,255,0.2) ${pct}%
)`;

progressTime.innerText =
formatTime(cur) +
" / " +
formatTime(dur);

requestAnimationFrame(updateProgress);

}

/* 曲選択 */
function selectSong(index){

currentSong = index;

buildSongList();

}
/* 拡大防止 */
document.addEventListener(
"dblclick",
e=>e.preventDefault(),
{ passive:false }
);

document.addEventListener(
"touchmove",
function(e){

if(e.scale !== 1){

e.preventDefault();

}

},
{ passive:false }
);

/* 音楽 */
const music =
document.getElementById("music");

/* UI */
const comboText =
document.getElementById("combo");

const judgeText =
document.getElementById("judge");

const scoreText =
document.getElementById("score");

const fullcombo =
document.getElementById("fullcombo");

const resultScreen =
document.getElementById("result-screen");

const resultScoreEl =
document.getElementById("result-score");

const resultComboEl =
document.getElementById("result-combo");

const resultMissEl =
document.getElementById("result-miss");

const resultFullcomboBadge =
document.getElementById("result-fullcombo-badge");

const controlsEl =
document.getElementById("controls");

const modeAreaEl =
document.getElementById("modeArea");

const startMenuEl =
document.getElementById("startMenu");

/* レーン */
const lanes =
document.querySelectorAll(".lane");

/* 状態 */
let combo = 0;
let score = 0;
let miss = 0;
let maxCombo = 0;
let totalDeduct = 0;
let totalNotes = 0;
let hitNotes = 0;

/* 連続ストリーク */
let exStreak = 0;
let pfStreak = 0;
let grStreak = 0;
let gdStreak = 0;

let started = false;
let paused = false;
let hardMode = false;

/* 難易度 */
let noteSpeed = 3;
let noteInterval = 450;

/* ノーツ */
let notes = [];

/* プレイ中UIの切り替え */
function setPlayingUI(isPlaying){

if(isPlaying){
// コントロールを左下へ
controlsEl.classList.add("playing");
// 難易度ボタンを非表示
modeAreaEl.classList.add("hidden");
}else{
// 元の位置へ
controlsEl.classList.remove("playing");
// 難易度ボタンを表示
modeAreaEl.classList.remove("hidden");
}

}

/* 曲読み込み */
music.addEventListener(
"loadedmetadata",
()=>{

generateNotes();

}
);

/* 譜面生成 */
function generateNotes(){

notes = [];

const songLength =
music.duration * 1000;

if(
!songLength ||
isNaN(songLength)
){
return;
}

for(
let i = 1000;
i < songLength;
i += noteInterval
){

if(hardMode && Math.random() < 0.4){

/* ダブルノート：異なる2レーンを同時に */
const laneA =
Math.floor(Math.random() * 4);

let laneB;
do{
laneB =
Math.floor(Math.random() * 4);
}while(laneB === laneA);

notes.push({ time:i, lane:laneA, double:true });
notes.push({ time:i, lane:laneB, double:true });

}else{

notes.push({
time:i,
lane: Math.floor(Math.random() * 4),
double: false
});

}

}

/* 総ノーツ数を確定 */
totalNotes = notes.length;
hitNotes = 0;

}

/* 再生して開始 */
function restartGame(){

/* 選択曲を反映 */
const song = SONGS[currentSong];

music.src = song.src;

document.querySelector(".song-title")
.innerText =
"🎵 " + song.title +
" / " + song.artist;

music.pause();

music.currentTime = 0;

/* ノーツ削除 */
document.querySelectorAll(".note")
.forEach(note=>{

clearInterval(note.move);

note.remove();

});

/* リセット */
score = 0;
combo = 0;
miss = 0;
maxCombo = 0;
totalDeduct = 0;
totalNotes = 0;
hitNotes = 0;
exStreak = 0;
pfStreak = 0;
grStreak = 0;
gdStreak = 0;

scoreText.innerText =
"Score : 0.00";

comboText.innerText =
"0";

fullcombo.style.display =
"none";

judgeText.innerText =
"START!! 🎵";

/* 状態 */
started = false;
paused = false;

/* 開始 */
startGame();

}

/* ゲーム開始 */
function startGame(){

started = true;

startMenuEl.style.display = "none";

/* 進行バー表示 */
progressWrap.style.display = "flex";

/* プレイ中UI切り替え */
setPlayingUI(true);

music.play();

/* 曲長さが取得できていれば即生成、なければ待つ */
if(music.duration && !isNaN(music.duration)){
generateNotes();
gameLoop();
updateProgress();
}else{
music.addEventListener(
"loadedmetadata",
()=>{
generateNotes();
gameLoop();
updateProgress();
},
{ once: true }
);
}

}

/* ループ */
function gameLoop(){

if(paused) return;

const currentTime =
music.currentTime * 1000;

notes.forEach(note=>{

if(
!note.spawned &&
currentTime >= note.time - 2200
){

createNote(note);

note.spawned = true;

}

});

if(!music.paused){

requestAnimationFrame(
gameLoop
);

}

}

/* ノーツ生成 */
function createNote(noteData){

const lane =
lanes[noteData.lane];

const note =
document.createElement("div");

note.classList.add("note");

if(noteData.double){
note.classList.add("double");
}

note.dataset.hit = "false";

lane.appendChild(note);

let pos = -30;

const move = setInterval(()=>{

if(paused) return;

pos += noteSpeed;

note.style.top =
pos + "px";

if(pos >= window.innerHeight){

if(
note.dataset.hit === "false"
){

miss++;

combo = 0;

comboText.innerText =
combo;

judgeText.style.color = "#ff6060";
judgeText.innerText =
"MISS ❌";
playSE("se-miss");
const deduct = 300;
totalDeduct += deduct;
score = Math.max(0, score - deduct);
scoreText.innerText =
"Score : " + formatScore(score);

exStreak = 0; pfStreak = 0;
grStreak = 0; gdStreak = 0;

}

note.remove();

clearInterval(move);

}

},16);

note.move = move;

}

/* 判定 */
function hitNote(laneIndex){

if(paused) return;

const lane =
lanes[laneIndex];

const laneNotes =
lane.querySelectorAll(".note");

if(laneNotes.length === 0){

/* 空タップ → MISSカウント・コンボリセット・-200点 */
miss++;
combo = 0;
comboText.innerText = combo;
judgeText.style.color = "#ff6060";
judgeText.innerText = "MISS ❌";
playSE("se-miss");

exStreak = 0; pfStreak = 0;
grStreak = 0; gdStreak = 0;

const deduct = 200;
totalDeduct += deduct;
score = Math.max(0, score - deduct);
scoreText.innerText =
"Score : " + formatScore(score);

return;

}

const note =
laneNotes[0];

const rect =
note.getBoundingClientRect();

const hitY =
window.innerHeight - 155;

/* 符号付きdiff：マイナス=早め、プラス=遅め */
const signedDiff =
rect.top - hitY;

const diff =
Math.abs(signedDiff);

const timing =
signedDiff < 0 ? " ⏩EARLY" : " ⏪LATE";

let addScore = 0;

/* EXCELLENT（最高精度：diff < 40） */
if(diff < 40){

judgeText.style.color = "#ff44ff";
judgeText.innerText = "EXCELLENT ☆彡";

/* タップ位置ボーナス：10点単位 */
const posBonus =
Math.round((1 - diff / 40) * 10) * 10;

addScore = 1000 + posBonus;

/* ストリーク */
exStreak++;
pfStreak = 0; grStreak = 0; gdStreak = 0;

let streakBonus = 0;
if(exStreak % 15 === 0){
streakBonus = 25000;
judgeText.innerText =
"⭐ EXCELLENT " + exStreak +
" STREAK! +" + streakBonus;
}

addScore += streakBonus;

/* PERFECT */
}else if(diff < 100){

judgeText.style.color = "#ffe066";
judgeText.innerText = "PERFECT ✨";

const posBonus =
Math.round((1 - (diff - 40) / 60) * 10) * 10;

addScore = 500 + posBonus;

exStreak = 0;
pfStreak++;
grStreak = 0; gdStreak = 0;

let streakBonus = 0;
if(pfStreak % 10 === 0){
streakBonus = 10000;
judgeText.innerText =
"✨ PERFECT " + pfStreak +
" STREAK! +" + streakBonus;
}

addScore += streakBonus;

/* GREAT */
}else if(diff < 160){

judgeText.style.color = "#66dfff";
judgeText.innerText = "GREAT 🔥" + timing;

const posBonus =
Math.round((1 - (diff - 100) / 60) * 10) * 10;

addScore = 200 + posBonus;

exStreak = 0; pfStreak = 0;
grStreak++;
gdStreak = 0;

let streakBonus = 0;
if(grStreak % 10 === 0){
streakBonus = 5000;
judgeText.innerText =
"🔥 GREAT " + grStreak +
" STREAK! +" + streakBonus;
}

addScore += streakBonus;

/* GOOD */
}else if(diff < 220){

judgeText.style.color = "#a0ff88";
judgeText.innerText = "GOOD 👍" + timing;

const posBonus =
Math.round((1 - (diff - 160) / 60) * 10) * 10;

addScore = 100 + posBonus;

exStreak = 0; pfStreak = 0; grStreak = 0;
gdStreak++;

let streakBonus = 0;
if(gdStreak % 10 === 0){
streakBonus = 2000;
judgeText.innerText =
"👍 GOOD " + gdStreak +
" STREAK! +" + streakBonus;
}

addScore += streakBonus;

/* MISS */
}else{

judgeText.style.color = "#ff6060";
judgeText.innerText = "MISS ❌";
playSE("se-miss");

miss++;
combo = 0;
comboText.innerText = combo;

/* ストリーク全リセット */
exStreak = 0; pfStreak = 0;
grStreak = 0; gdStreak = 0;

/* タイミングミス減点 -300 */
const deduct = 300;
totalDeduct += deduct;
score = Math.max(0, score - deduct);
scoreText.innerText =
"Score : " + formatScore(score);

return;

}

/* combo を先に増やしてから倍率計算 */
combo++;

if(combo > maxCombo){
maxCombo = combo;
}

/* コンボ倍率（固定定義） */
const COMBO_RATES = [
{ min: 101, bonus: 15  },
{ min:  51, bonus: 10  },
{ min:  32, bonus:  8  },
{ min:  12, bonus:  2.5},
{ min:   1, bonus:  2.0}
];

let comboBonus = 2.0;
for(const r of COMBO_RATES){
if(combo >= r.min){
comboBonus = r.bonus;
break;
}
}

/* スコア加算（小数2桁） */
score = Math.round(
(score + addScore * comboBonus) * 100
) / 100;

comboText.innerText = combo;

scoreText.innerText =
"Score : " + formatScore(score);

/* ノーツ削除 */
note.dataset.hit = "true";
hitNotes++;

clearInterval(note.move);

note.remove();

/* 演出 */
tapEffect(lane, judgeText.style.color);

/* コンボ演出 + SE */
if(combo >= 100 && combo % 100 === 0){

playSE("se-combo100");
judgeText.style.color = "#ff66cc";
judgeText.innerText =
"🔥 AMAZING COMBO 🔥";

}else if(combo === 70){

playSE("se-combo70");
judgeText.style.color = "#ff66cc";
judgeText.innerText =
"70 COMBO 🔥";

}else if(combo === 50){

playSE("se-combo50");
judgeText.style.color = "#ff66cc";
judgeText.innerText =
"50 COMBO 🔥";

}else if(combo === 30){

playSE("se-combo30");
judgeText.style.color = "#ffe066";
judgeText.innerText =
"30 COMBO 🔥";

}else if(combo >= 50){

judgeText.style.color = "#ff66cc";
judgeText.innerText =
"🔥 AMAZING COMBO 🔥";

}else if(combo % 10 === 0){

judgeText.style.color = "#ffe066";
judgeText.innerText =
combo + " COMBO 🔥";

}

}

/* エフェクト */
function tapEffect(lane, color){

color = color || "rgba(255,255,255,0.5)";

const effect =
document.createElement("div");

effect.classList.add(
"tap-effect"
);

effect.style.background = color;
effect.style.boxShadow =
"0 0 20px " + color +
", 0 0 40px " + color;

lane.appendChild(effect);

setTimeout(()=>{

effect.remove();

},250);

}

/* 一時停止 */
function pauseGame(){

if(!started) return;

if(!paused){

music.pause();

paused = true;

judgeText.innerText =
"⏸ PAUSE";

}else{

music.play();

paused = false;

gameLoop();

judgeText.innerText =
"▶ RESUME";

}

}

/* リセット → スタート画面へ */
function resetScore(){

music.pause();
music.currentTime = 0;

/* ノーツ削除 */
document.querySelectorAll(".note")
.forEach(note=>{
clearInterval(note.move);
note.remove();
});

score = 0;
combo = 0;
miss = 0;
maxCombo = 0;
totalDeduct = 0;

started = false;
paused = false;

scoreText.innerText = "Score : 0";
comboText.innerText = "0";
judgeText.innerText = "READY";
fullcombo.style.display = "none";
resultScreen.style.display = "none";

setPlayingUI(false);

progressWrap.style.display = "none";

startMenuEl.style.display = "flex";

}

/* リザルトから閉じてもう一度 */
function closeResult(){

resultScreen.style.display = "none";
fullcombo.style.display = "none";
startMenuEl.style.display = "flex";

}

/* スタート画面に戻る */
function goToStart(){

resultScreen.style.display = "none";
fullcombo.style.display = "none";

score = 0;
combo = 0;
miss = 0;
maxCombo = 0;
totalDeduct = 0;
totalNotes = 0;
hitNotes = 0;

started = false;
paused = false;

scoreText.innerText = "Score : 0";
comboText.innerText = "0";
judgeText.innerText = "READY";

setPlayingUI(false);

startMenuEl.style.display = "flex";

}
function setEasyMode(){

hardMode = false;
noteSpeed = 2;
noteInterval = 650;

restartGame();

judgeText.innerText =
"🌟 EASY MODE";

}

/* 上級 */
function setHardMode(){

hardMode = true;
noteSpeed = 5;
noteInterval = 300;

restartGame();

judgeText.innerText =
"🔥 HARD MODE";

}

/* スマホ操作 */
lanes.forEach(
(lane,index)=>{

lane.addEventListener(
"touchstart",
(e)=>{

e.preventDefault();

hitNote(index);

},
{ passive:false }
);

}
);

/* PC操作 */
document.addEventListener(
"keydown",
(e)=>{

if(e.key === "d"){
hitNote(0);
}

if(e.key === "f"){
hitNote(1);
}

if(e.key === "j"){
hitNote(2);
}

if(e.key === "k"){
hitNote(3);
}

}
);

const resultAccuracyEl =
document.getElementById("result-accuracy");

const resultFailureEl =
document.getElementById("result-failure");

const resultPerfectMsg =
document.getElementById("result-perfect-msg");

const resultDeductEl =
document.getElementById("result-deduct");

/* 曲終了 */
music.addEventListener(
"ended",
()=>{

judgeText.innerText = "";

/* 成功・失敗率：全ミス(miss)をtotalNotesで割る
   空タップで miss > totalNotes になる場合も考慮 */
const baseDenom = Math.max(totalNotes, miss);
const accuracy = baseDenom > 0
? Math.max(0, Math.min(100, Math.round(
((baseDenom - miss) / baseDenom) * 100
)))
: 0;

const failure = Math.max(0, 100 - accuracy);

/* ① ゲーム画面に成功率を大きく表示 */
const overlay =
document.getElementById("accuracy-overlay");

document.getElementById("accuracy-number")
.innerText = accuracy + "%";

document.getElementById("accuracy-label")
.innerText = "SUCCESS RATE";

document.getElementById("accuracy-number")
.innerText = accuracy + "%";

const subEl =
document.getElementById("accuracy-sub");

const failureLabel = failure > 0
? `FAILURE : ${failure}%` : "";

if(accuracy === 100){
subEl.innerText =
"🏆 SUPER EXCELLENT\nCONGRATULATIONS! 🏆";
}else if(accuracy >= 90){
subEl.innerText = "⭐ EXCELLENT!\n" + failureLabel;
}else if(accuracy >= 70){
subEl.innerText = "👏 GREAT JOB!\n" + failureLabel;
}else{
subEl.innerText = failureLabel;
}

overlay.style.display = "flex";

/* show クラスでアニメーション発火 */
requestAnimationFrame(()=>{
requestAnimationFrame(()=>{
overlay.classList.add("show");
});
});

/* ② 2.5秒後にスコア画面へ */
setTimeout(()=>{

overlay.classList.remove("show");

setTimeout(()=>{

overlay.style.display = "none";

/* リザルト表示 */
resultScoreEl.innerText = formatScore(score);
resultComboEl.innerText = maxCombo;
resultMissEl.innerText = miss;
resultDeductEl.innerText = "-" + totalDeduct;

resultAccuracyEl.innerText = accuracy + "%";
resultFailureEl.innerText = failure + "%";

if(accuracy === 100){
resultPerfectMsg.style.display = "block";
}else{
resultPerfectMsg.style.display = "none";
}

if(miss === 0){
resultFullcomboBadge.style.display = "block";
}else{
resultFullcomboBadge.style.display = "none";
}

resultScreen.style.display = "flex";

/* プレイ終了UIに戻す */
setPlayingUI(false);

progressWrap.style.display = "none";

}, 400);

}, 2500);

}
);

/* リザルト閉じてスタート画面へ */
function closeResult(){

resultScreen.style.display = "none";

fullcombo.style.display = "none";

startMenuEl.style.display = "flex";

}

/* Service Worker 登録 */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .catch(err => console.log("SW error:", err));
  });
}

/* 起動時に曲リスト生成 */
buildSongList();

</script>
