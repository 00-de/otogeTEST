<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no
">

<title>DayDream Beats!!</title>

<!-- PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DayDream Beats">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#001d3d">

<link rel="manifest" href="manifest.json">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:black;
touch-action:none;
overscroll-behavior:none;
}

#game{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;

background:
linear-gradient(
to bottom,
#58c6ff,
#001d3d
);

color:white;
}

.bg{
position:absolute;
width:100%;
height:100%;
background:
url('bg.jpg')
center/cover;
opacity:0.35;
}

/* 上UI */

.top-ui{
position:absolute;
top:15px;
left:0;
width:100%;
padding:0 55px 0 15px;

display:flex;
justify-content:space-between;
align-items:center;

z-index:100;
}

.song-title{
font-size:18px;
font-weight:bold;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

max-width:60%;

text-shadow:
0 0 10px black;
}

.score{
font-size:18px;
font-weight:bold;
}

/* ボタン */

.controls{
position:absolute;

top:60px;
left:50%;

transform:translateX(-50%);

display:flex;
flex-wrap:wrap;

justify-content:center;

gap:8px;

width:95%;

z-index:100;

transition: all 0.3s ease;
}

.controls.playing{
top:auto;
bottom:60px;
left:10px;
transform:none;
width:auto;
flex-direction:column;
gap:6px;
}

.control-btn{
padding:8px 14px;

border:none;
border-radius:12px;

background:white;
color:#222;

font-size:13px;
font-weight:bold;

box-shadow:
0 0 10px white;
}

.controls.playing .control-btn{
padding:7px 12px;
font-size:12px;
opacity:0.85;
}

/* 難易度 */

.mode-btn{
padding:8px 14px;

border:none;
border-radius:12px;

background:#ffffffcc;

font-size:13px;
font-weight:bold;
}

/* コンボ */

#combo{
position:absolute;

bottom:82px;
left:50%;

transform:translateX(-50%);

font-size:36px;
font-weight:bold;

z-index:100;

text-shadow:
0 0 20px white;
}

/* 判定 */

#judge{
position:absolute;

bottom:90px;
right:15px;

font-size:15px;
font-weight:bold;

z-index:100;

text-align:right;

text-shadow:
0 0 8px currentColor;
}

/* レーン */

.lanes{
position:absolute;

bottom:0;
left:50%;

transform:translateX(-50%);

width:95%;
max-width:520px;

height:100%;

display:flex;
}

.lane{
flex:1;
position:relative;

border-left:
2px solid rgba(255,255,255,0.15);

border-right:
2px solid rgba(255,255,255,0.15);
}

.hit-line{
position:absolute;

bottom:130px;

width:100%;
height:10px;

background:white;

box-shadow:
0 0 20px white,
0 0 40px white;
}

/* ノーツ */

.note{
position:absolute;

width:80%;
height:24px;

left:10%;

border-radius:15px;

background:
linear-gradient(
90deg,
#ffffff,
#8ce8ff
);

box-shadow:
0 0 15px #8ce8ff,
0 0 35px #8ce8ff;
}

/* エフェクト */

.tap-effect{
position:absolute;

bottom:110px;

width:100%;
height:60px;

background:
rgba(255,255,255,0.5);

animation:flash 0.25s;
}

@keyframes flash{

0%{
opacity:1;
transform:scaleY(1);
}

100%{
opacity:0;
transform:scaleY(2);
}

}

/* 曲選択 */

.song-select-title{
font-size:16px;
font-weight:bold;

letter-spacing:3px;

color:#aee8ff;

text-shadow:
0 0 10px #aee8ff;

margin-bottom:4px;

text-align:center;
}

.song-list{
display:flex;
flex-direction:column;
gap:10px;
width:100%;
}

.song-btn{
padding:14px 20px;

border:none;
border-radius:16px;

background:rgba(255,255,255,0.15);

color:white;

font-size:15px;
font-weight:bold;

text-align:left;

box-shadow:
0 0 12px rgba(140,232,255,0.3);

border:1px solid rgba(140,232,255,0.3);
}

.song-btn.selected{
background:rgba(140,232,255,0.3);

box-shadow:
0 0 20px rgba(140,232,255,0.6);

border-color:#8ce8ff;
}

/* スタート */

.start-menu{
position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);

display:flex;
flex-direction:column;

gap:15px;

z-index:300;
}

.menu-btn{
padding:20px 35px;

font-size:24px;
font-weight:bold;

border:none;
border-radius:20px;

background:white;
color:#333;

box-shadow:
0 0 25px white;
}

</style>
</head>

<body>

<div id="game">

<div class="bg"></div>

<!-- 上UI -->

<div class="top-ui">

<div class="song-title">
🎵 風になる合図 / 蓮
</div>

<div class="score"
id="score">
Score : 0.00
</div>

</div>

<!-- ボタン -->

<div class="controls"
id="controls">

<button class="control-btn"
onclick="pauseGame()">

⏸ 一時停止

</button>

<button class="control-btn"
onclick="resetScore()">

🔄 リセット

</button>

</div>

<!-- 判定 -->

<div id="judge">
READY
</div>

<!-- スタート -->

<div class="start-menu"
id="startMenu">

<div class="song-select-title">

🎵 SELECT SONG

</div>

<div class="song-list">

<button class="song-btn selected"
id="songBtn0"
onclick="selectSong(0)">

風になる合図 / 蓮

</button>

<button class="song-btn"
id="songBtn1"
onclick="selectSong(1)">

きらめく方程式 / DayDream プラス

</button>

</div>

<!-- 初級 上級 -->

<div class="mode-select-row"
style="
display:flex;
gap:8px;
justify-content:center;
">

<button class="mode-btn"
onclick="setEasyMode()">

🌟 初級

</button>

<button class="mode-btn"
onclick="setHardMode()">

🔥 上級

</button>

</div>

<button class="menu-btn"
onclick="restartGame()">

▶ スタート

</button>

</div>

<!-- レーン -->

<div class="lanes">

<div class="lane" data-lane="0">
<div class="hit-line"></div>
</div>

<div class="lane" data-lane="1">
<div class="hit-line"></div>
</div>

<div class="lane" data-lane="2">
<div class="hit-line"></div>
</div>

<div class="lane" data-lane="3">
<div class="hit-line"></div>
</div>

</div>

<!-- コンボ -->

<div id="combo">
0
</div>

</div>

<!-- 音楽 -->

<audio id="music"
src="kaze.mp3">
</audio>

<script>

/* 曲 */

const SONGS = [

{
title:"風になる合図",
artist:"蓮",
src:"kaze.mp3"
},

{
title:"きらめく方程式",
artist:"DayDream プラス",
src:"きらめく方程式.mp3"
}

];

let currentSong = 0;

/* 音 */

const music =
document.getElementById("music");

/* UI */

const comboText =
document.getElementById("combo");

const judgeText =
document.getElementById("judge");

const scoreText =
document.getElementById("score");

const lanes =
document.querySelectorAll(".lane");

/* 状態 */

let combo = 0;
let score = 0;
let miss = 0;
let maxCombo = 0;
let totalDeduct = 0;

let paused = false;

let noteSpeed = 3;
let noteInterval = 450;

/* スコア表示 */

function formatScore(val){

const fixed =
val.toFixed(2);

const parts =
fixed.split(".");

parts[0] =
parts[0].replace(
/\B(?=(\d{3})+(?!\d))/g,
","
);

return parts.join(".");

}

/* 曲選択 */

function selectSong(index){

currentSong = index;

SONGS.forEach((_,i)=>{

const btn =
document.getElementById(
"songBtn"+i
);

btn.classList.toggle(
"selected",
i===index
);

});

}

/* ゲーム開始 */

function restartGame(){

const song =
SONGS[currentSong];

music.src =
song.src;

document.querySelector(
".song-title"
).innerText =
"🎵 " +
song.title +
" / " +
song.artist;

music.currentTime = 0;

music.play();

document.getElementById(
"startMenu"
).style.display = "none";

}

/* 初級 */

function setEasyMode(){

noteSpeed = 2;

noteInterval = 650;

judgeText.innerText =
"🌟 EASY MODE";

}

/* 上級 */

function setHardMode(){

noteSpeed = 5;

noteInterval = 300;

judgeText.innerText =
"🔥 HARD MODE";

}

/* ノーツ生成 */

function createNote(laneIndex){

const lane =
lanes[laneIndex];

const note =
document.createElement("div");

note.classList.add("note");

lane.appendChild(note);

let pos = -30;

const move =
setInterval(()=>{

if(paused) return;

pos += noteSpeed;

note.style.top =
pos + "px";

if(
pos >=
window.innerHeight
){

clearInterval(move);

note.remove();

}

},16);

note.move = move;

}

/* 判定 */

function hitNote(laneIndex){

if(paused) return;

const lane =
lanes[laneIndex];

const laneNotes =
lane.querySelectorAll(".note");

/* 空打ち */

if(laneNotes.length === 0){

miss++;

combo = 0;

comboText.innerText =
combo;

judgeText.style.color =
"#ff6060";

judgeText.innerText =
"MISS ❌";

/* -200 */

score =
Math.max(
0,
score - 200
);

totalDeduct += 200;

scoreText.innerText =
"Score : " +
formatScore(score);

return;

}

const note =
laneNotes[0];

const rect =
note.getBoundingClientRect();

const hitY =
window.innerHeight - 155;

const signedDiff =
rect.top - hitY;

const diff =
Math.abs(signedDiff);

const timing =
signedDiff < 0
? " ⏩EARLY"
: " ⏪LATE";

let baseScore = 0;
let judgeType = "";

/* EXCELLENT */

if(diff < 35){

judgeType =
"EXCELLENT";

judgeText.style.color =
"#ffccff";

judgeText.innerText =
"EXCELLENT ☆彡";

baseScore = 1000;

/* PERFECT */

}else if(diff < 70){

judgeType =
"PERFECT";

judgeText.style.color =
"#ffe066";

judgeText.innerText =
"PERFECT ✨";

baseScore = 500;

/* GREAT */

}else if(diff < 120){

judgeType =
"GREAT";

judgeText.style.color =
"#66dfff";

judgeText.innerText =
"GREAT 🔥" + timing;

baseScore = 200;

/* GOOD */

}else if(diff < 170){

judgeType =
"GOOD";

judgeText.style.color =
"#a0ff88";

judgeText.innerText =
"GOOD 👍" + timing;

baseScore = 100;

/* MISS */

}else{

judgeText.style.color =
"#ff6060";

judgeText.innerText =
"MISS ❌";

miss++;

combo = 0;

comboText.innerText =
combo;

/* -300 */

score =
Math.max(
0,
score - 300
);

totalDeduct += 300;

scoreText.innerText =
"Score : " +
formatScore(score);

return;

}

/* 横バー精度 */

const accuracyRate =
Math.max(
0,
1 - (diff / 170)
);

/* 10点単位 */

let addScore =
Math.round(
(baseScore *
accuracyRate) / 10
) * 10;

/* コンボ */

combo++;

if(combo > maxCombo){

maxCombo = combo;

}

comboText.innerText =
combo;

/* コンボ倍率維持 */

const COMBO_RATES = [

{
min:101,
bonus:15
},

{
min:51,
bonus:10
},

{
min:32,
bonus:8
},

{
min:12,
bonus:2.5
},

{
min:1,
bonus:2.0
}

];

let comboBonus = 2.0;

for(const r of COMBO_RATES){

if(combo >= r.min){

comboBonus =
r.bonus;

break;

}

}

/* 倍率 */

addScore =
Math.round(
addScore *
comboBonus
);

/* 加算 */

score += addScore;

/* BONUS */

if(
judgeType==="EXCELLENT" &&
combo % 15 === 0
){

score += 25000;

judgeText.innerText =
"🌟 EXCELLENT BONUS +25000";

}

if(
judgeType==="PERFECT" &&
combo % 10 === 0
){

score += 10000;

judgeText.innerText =
"✨ PERFECT BONUS +10000";

}

if(
judgeType==="GREAT" &&
combo % 10 === 0
){

score += 5000;

judgeText.innerText =
"🔥 GREAT BONUS +5000";

}

if(
judgeType==="GOOD" &&
combo % 10 === 0
){

score += 2000;

judgeText.innerText =
"👍 GOOD BONUS +2000";

}

/* 小数 */

score =
Math.round(
score * 100
) / 100;

/* 表示 */

scoreText.innerText =
"Score : " +
formatScore(score);

/* 削除 */

clearInterval(
note.move
);

note.remove();

/* エフェクト */

tapEffect(
lane,
judgeText.style.color
);

}

/* エフェクト */

function tapEffect(lane,color){

const effect =
document.createElement("div");

effect.classList.add(
"tap-effect"
);

effect.style.background =
color;

lane.appendChild(effect);

setTimeout(()=>{

effect.remove();

},250);

}

/* 一時停止 */

function pauseGame(){

if(!paused){

music.pause();

paused = true;

judgeText.innerText =
"⏸ PAUSE";

}else{

music.play();

paused = false;

judgeText.innerText =
"▶ RESUME";

}

}

/* リセット */

function resetScore(){

score = 0;
combo = 0;
miss = 0;

scoreText.innerText =
"Score : 0.00";

comboText.innerText =
"0";

judgeText.innerText =
"READY";

}

/* ノーツ生成 */

setInterval(()=>{

createNote(
Math.floor(
Math.random()*4
)
);

},450);

/* タッチ */

lanes.forEach(
(lane,index)=>{

lane.addEventListener(
"touchstart",
e=>{

e.preventDefault();

hitNote(index);

},
{ passive:false }
);

}
);

/* キーボード */

document.addEventListener(
"keydown",
e=>{

if(e.key==="d"){
hitNote(0);
}

if(e.key==="f"){
hitNote(1);
}

if(e.key==="j"){
hitNote(2);
}

if(e.key==="k"){
hitNote(3);
}

}
);

</script>

</body>
</html>
