<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>DayDream 音ゲー</title>

<style>

body{
    margin:0;
    background:#000;
    overflow:hidden;
    font-family:sans-serif;
    color:white;
    text-align:center;
}

#topUI{
    position:fixed;
    top:10px;
    width:100%;
    z-index:100;
}

#score{
    font-size:24px;
}

#combo{
    font-size:32px;
    color:yellow;
}

#songButtons{
    margin-top:10px;
}

.songBtn{
    padding:10px 20px;
    margin:5px;
    border:none;
    border-radius:10px;
    background:#444;
    color:white;
    font-size:16px;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
}

.lane{
    position:absolute;
    bottom:0;
    width:25%;
    height:100%;
    border-left:1px solid #333;
    border-right:1px solid #333;
}

#lane0{ left:0%; }
#lane1{ left:25%; }
#lane2{ left:50%; }
#lane3{ left:75%; }

.note{
    position:absolute;
    width:80%;
    height:20px;
    left:10%;
    background:cyan;
    border-radius:10px;
}

.hit{
    position:absolute;
    bottom:100px;
    width:100%;
    height:10px;
    background:red;
}

.btn{
    position:absolute;
    bottom:0;
    width:25%;
    height:100px;
    opacity:0.2;
}

#btn0{ left:0%; background:#ff4444; }
#btn1{ left:25%; background:#44ff44; }
#btn2{ left:50%; background:#4444ff; }
#btn3{ left:75%; background:#ffff44; }

</style>
</head>

<body>

<div id="topUI">
    <div id="score">Score: 0</div>
    <div id="combo">0 Combo</div>

    <div id="songButtons">
        <button class="songBtn"
        onclick="loadSong(0)">
        風
        </button>

        <button class="songBtn"
        onclick="loadSong(1)">
        きらめく方程式!!
        </button>
    </div>
</div>

<div id="game">

    <div class="lane" id="lane0">
        <div class="hit"></div>
    </div>

    <div class="lane" id="lane1">
        <div class="hit"></div>
    </div>

    <div class="lane" id="lane2">
        <div class="hit"></div>
    </div>

    <div class="lane" id="lane3">
        <div class="hit"></div>
    </div>

    <div class="btn" id="btn0"
    ontouchstart="hitLane(0)"
    onclick="hitLane(0)">
    </div>

    <div class="btn" id="btn1"
    ontouchstart="hitLane(1)"
    onclick="hitLane(1)">
    </div>

    <div class="btn" id="btn2"
    ontouchstart="hitLane(2)"
    onclick="hitLane(2)">
    </div>

    <div class="btn" id="btn3"
    ontouchstart="hitLane(3)"
    onclick="hitLane(3)">
    </div>

</div>

<script>

const songs = [

{
    title:"風",
    music:"kaze.mp3",
    notes:"notes.json"
},

{
    title:"きらめく方程式!",
    music:"きらめく方程式.mp3",
    notes:"notes2.json"
}

];

let audio = new Audio();

let notesData = [];

let score = 0;
let combo = 0;

let activeNotes = [];

function loadSong(index){

    audio.pause();

    score = 0;
    combo = 0;

    document.getElementById("score")
    .innerText = "Score: 0";

    document.getElementById("combo")
    .innerText = "0 Combo";

    fetch(songs[index].notes)
    .then(res=>res.json())
    .then(data=>{

        notesData = data;

        startGame(index);

    });

}

function startGame(index){

    document.querySelectorAll(".note")
    .forEach(n=>n.remove());

    activeNotes = [];

    audio = new Audio(songs[index].music);

    audio.play();

    const startTime = Date.now();

    const interval = setInterval(()=>{

        const currentTime =
        Date.now() - startTime;

        notesData.forEach(note=>{

            if(!note.spawned &&
               currentTime >= note.time){

                spawnNote(note);

                note.spawned = true;
            }

        });

        if(audio.ended){

            clearInterval(interval);

        }

    },16);

}

function spawnNote(note){

    const lane =
    document.getElementById(
    "lane"+note.lane);

    const div =
    document.createElement("div");

    div.className = "note";

    div.style.top = "-20px";

    lane.appendChild(div);

    const obj = {

        lane:note.lane,
        y:-20,
        el:div

    };

    activeNotes.push(obj);

}

function gameLoop(){

    activeNotes.forEach((note,index)=>{

        note.y += 5;

        note.el.style.top =
        note.y+"px";

        if(note.y > window.innerHeight){

            note.el.remove();

            activeNotes.splice(index,1);

            combo = 0;

            updateUI();

        }

    });

    requestAnimationFrame(gameLoop);

}

gameLoop();

function hitLane(lane){

    activeNotes.forEach((note,index)=>{

        if(note.lane === lane){

            if(note.y > window.innerHeight-250 &&
               note.y < window.innerHeight-120){

                note.el.remove();

                activeNotes.splice(index,1);

                score += 100;

                combo++;

                updateUI();

            }

        }

    });

}

function updateUI(){

    document.getElementById("score")
    .innerText =
    "Score: " + score;

    document.getElementById("combo")
    .innerText =
    combo + " Combo";

}

</script>

</body>
</html>
